   Helpers de contenido

const LETTERS = ['A', 'B', 'C', 'D'];

function callout(text, tone = 'navy') {
  const tones = {
    navy: 'bg-navy-50 border-navy-700 text-navy-900',
    amber: 'bg-amber-50 border-amber-500 text-amber-900',
    green: 'bg-emerald-50 border-emerald-600 text-emerald-900'

  return `<div class="my-6 border-l-4 rounded-r-xl px-5 py-4 ${tones[tone]}">${text}</div>`;
}

function h3(text) {
  return `<h3 class="text-lg sm:text-xl font-semibold text-navy-900 mt-8 mb-3">${text}</h3>`;
}

/* Diagrama circular del ciclo de mejora (Módulo 7) */
function cycleSVG() {
  const steps = [
    { t: ['Relevamiento'], e: '🔍' },
    { t: ['Diagnóstico'], e: '🩺' },
    { t: ['Diseño'], e: '✏️' },
    { t: ['Implemen-', 'tación'], e: '🚀' },
    { t: ['Medición'], e: '📏' },
    { t: ['Ajuste'], e: '🔧' }
  ];
  const cx = 220, cy = 220, R = 150, r = 48;
  const n = steps.length;
  const toXY = (deg, rad) => [cx + rad * Math.cos(deg * Math.PI / 180), cy + rad * Math.sin(deg * Math.PI / 180)];
  let arcs = '', nodes = '';
  const gap = 23; // grados que ocupa cada nodo sobre el círculo
  for (let i = 0; i < n; i++) {
    const a = -90 + i * (360 / n);
    const b = -90 + (i + 1) * (360 / n);
    const [x1, y1] = toXY(a + gap, R);
    const [x2, y2] = toXY(b - gap, R);
    arcs += `<path d="M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${R} ${R} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}" fill="none" stroke="#5b7fb5" stroke-width="3" marker-end="url(#arrowCycle)"/>`;
    const [nx, ny] = toXY(a, R);
    const s = steps[i];
    const lines = s.t.map((line, li) => `<text x="${nx.toFixed(1)}" y="${(ny + 12 + li * 13 - (s.t.length - 1) * 5).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">${line}</text>`).join('');
    nodes += `<g><circle cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" r="${r}" fill="#152d54" stroke="#ffffff" stroke-width="3"/>
      <text x="${nx.toFixed(1)}" y="${(ny - 10 - (s.t.length - 1) * 5).toFixed(1)}" text-anchor="middle" font-size="18">${s.e}</text>${lines}
      <text x="${nx.toFixed(1)}" y="${(ny - r - 6).toFixed(1)}" text-anchor="middle" font-size="11" fill="#64748b" font-weight="600">${i + 1}</text></g>`;
  }
  return `<svg viewBox="0 0 440 440" class="w-full max-w-md mx-auto" role="img" aria-label="Ciclo de trabajo: Relevamiento, Diagnóstico, Diseño, Implementación, Medición, Ajuste">
    <defs><marker id="arrowCycle" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b7fb5"/></marker></defs>
    <circle cx="${cx}" cy="${cy}" r="78" fill="#f0f4fa" stroke="#dce5f2" stroke-width="2"/>
    <text x="${cx}" y="${cy - 6}" text-anchor="middle" font-size="15" font-weight="700" fill="#0f213f">Ciclo de</text>
    <text x="${cx}" y="${cy + 14}" text-anchor="middle" font-size="15" font-weight="700" fill="#0f213f">mejora continua</text>
    ${arcs}${nodes}
  </svg>`;
}

/* =========================================================
   Estado (en memoria)
   ========================================================= */
const TOTAL = MODULES.length;
const SUMMARY = TOTAL; // índice de la pantalla de resumen final
const state = {
  current: 0,
  answers: MODULES.map(m => m.quiz.map(() => null)),
  submitted: MODULES.map(() => false)
};
let kpiChart = null;

const $ = id => document.getElementById(id);
const scoreOf = mi => MODULES[mi].quiz.reduce((acc, q, qi) => acc + (state.answers[mi][qi] === q.correct ? 1 : 0), 0);
const totalScore = () => MODULES.reduce((acc, _, mi) => acc + (state.submitted[mi] ? scoreOf(mi) : 0), 0);
const maxScore = () => MODULES.reduce((acc, m) => acc + m.quiz.length, 0);
const allSubmitted = () => state.submitted.every(Boolean);
// Un módulo está desbloqueado si todos los anteriores tienen el quiz completo
const isUnlocked = i => i === 0 || (i <= TOTAL && state.submitted.slice(0, i).every(Boolean));

/* =========================================================
   Render
   ========================================================= */
function quizHTML(mi) {
  const m = MODULES[mi];
  const sub = state.submitted[mi];
  const answered = state.answers[mi].filter(a => a !== null).length;

  let html = `<section id="quiz" class="mt-12 pt-8 border-t-2 border-dashed border-slate-200">
    <div class="flex flex-wrap items-center justify-between gap-2">
      <h3 class="text-xl font-semibold text-navy-900">📝 Quiz del módulo</h3>
      <span class="text-sm text-slate-500">${sub ? 'Quiz completado' : `${answered} de ${m.quiz.length} respondidas`}</span>
    </div>
    <p class="text-slate-500 text-sm mt-1">Respondé las ${m.quiz.length} preguntas para habilitar el siguiente módulo. No es necesario aprobar.</p>`;

  if (sub) {
    const s = scoreOf(mi);
    const tone = s === m.quiz.length ? 'bg-emerald-50 border-emerald-300 text-emerald-900'
      : s === 0 ? 'bg-red-50 border-red-300 text-red-900' : 'bg-amber-50 border-amber-300 text-amber-900';
    const msg = s === m.quiz.length ? '¡Excelente! Respondiste todo correctamente.'
      : s === 0 ? 'Revisá las explicaciones de cada pregunta antes de seguir.' : 'Buen trabajo. Revisá las explicaciones de las incorrectas.';
    html += `<div id="quizResult" class="fade-in mt-5 rounded-xl border-2 ${tone} p-5 flex items-center gap-4">
      <div class="text-3xl font-extrabold">${s}/${m.quiz.length}</div>
      <div><p class="font-semibold">${s} de ${m.quiz.length} correctas</p><p class="text-sm">${msg}</p></div>
    </div>`;
  }

  m.quiz.forEach((q, qi) => {
    const sel = state.answers[mi][qi];
    const ok = sub && sel === q.correct;
    const card = !sub ? 'border-slate-200 bg-white' : ok ? 'border-emerald-300 bg-emerald-50/40' : 'border-red-400 bg-red-50/60';
    html += `<fieldset class="mt-6 rounded-xl border-2 ${card} p-4 sm:p-5">
      <legend class="sr-only">Pregunta ${qi + 1}</legend>
      <p class="font-semibold text-navy-900 flex gap-2">
        <span class="shrink-0">${sub ? (ok ? '✅' : '❌') : `${qi + 1}.`}</span><span>${q.q}</span>
      </p>
      <div class="mt-4 grid grid-cols-1 gap-2">`;
    q.options.forEach((opt, oi) => {
      let cls;
      if (!sub) {
        cls = sel === oi ? 'border-navy-700 bg-navy-50 ring-1 ring-navy-700 cursor-pointer'
          : 'border-slate-200 hover:border-navy-400 hover:bg-slate-50 cursor-pointer';
      } else if (oi === q.correct) {
        cls = 'border-emerald-500 bg-emerald-50 text-emerald-900 font-medium';
      } else if (oi === sel) {
        cls = 'border-red-500 bg-red-100 text-red-900 line-through decoration-red-400';
      } else {
        cls = 'border-slate-200 text-slate-400';
      }
      html += `<label class="flex items-start gap-3 rounded-lg border px-4 py-3 transition ${cls}">
        <input type="radio" class="mt-1 shrink-0" name="q${mi}_${qi}" value="${oi}" data-q="${qi}" ${sel === oi ? 'checked' : ''} ${sub ? 'disabled' : ''}>
        <span class="shrink-0 font-semibold">${LETTERS[oi]})</span><span>${opt}</span>
      </label>`;
    });
    html += `</div>`;
    if (sub && !ok) {
      html += `<div class="fade-in mt-4 rounded-lg bg-white border border-red-200 p-4 text-sm">
        <p class="text-red-700 font-semibold">Incorrecta. Respuesta correcta: ${LETTERS[q.correct]}) ${q.options[q.correct]}</p>
        <p class="text-slate-700 mt-2 leading-relaxed">${q.explanation}</p>
      </div>`;
    } else if (sub && ok) {
      html += `<p class="mt-3 text-sm text-emerald-700 font-medium">¡Correcta!</p>`;
    }
    html += `</fieldset>`;
  });

  if (!sub) {
    html += `<div class="mt-6 flex flex-wrap items-center gap-3">
      <button id="submitQuiz" class="px-6 py-3 rounded-xl bg-navy-800 text-white font-semibold hover:bg-navy-700 disabled:bg-slate-300 disabled:text-slate-500 disabled:cursor-not-allowed transition" ${answered < m.quiz.length ? 'disabled' : ''}>
        Enviar respuestas
      </button>
      ${answered < m.quiz.length ? '<span class="text-sm text-slate-500">Respondé todas las preguntas para enviar.</span>' : ''}
    </div>`;
  }
  html += `</section>`;
  return html;
}

function renderQuiz(mi, focusName) {

function renderChart() {
  const canvas = $('kpiChart');
  if (!window.Chart) {
    canvas.parentElement.classList.add('hidden');
    $('chartFallback').classList.remove('hidden');
    return;
  }
  const units = ['días', '%', 'USD por pedido', 'cientos de pedidos/día', 'puntos sobre 10'];
  kpiChart = new Chart(canvas, {
    type: 'bar',
    data: {
      labels: ['Tiempo de ciclo', 'Tasa de error', 'Costo del proceso', 'Capacidad', 'Satisfacción'],
      datasets: [
        { label: 'Antes', data: [5, 8, 12, 3, 6], backgroundColor: '#94a3b8', borderRadius: 6 },
        { label: 'Después', data: [2.5, 3, 8.5, 4.5, 8.5], backgroundColor: '#1b3a6b', borderRadius: 6 }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'top', labels: { usePointStyle: true, pointStyle: 'rectRounded' } },
        tooltip: { callbacks: { label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y} ${units[ctx.dataIndex]}` } },
        title: { display: true, text: '↓ menos es mejor en tiempo, error y costo  ·  ↑ más es mejor en capacidad y satisfacción', color: '#64748b', font: { size: 11, weight: 'normal' } }
      },
      scales: {
        y: { beginAtZero: true, grid: { color: '#e2e8f0' }, ticks: { color: '#64748b' } },
        x: { grid: { display: false }, ticks: { color: '#334155' } }
      }
    }
  });
}

  $('progressBar').style.width = onSummary ? '100%' : `${((i + 1) / TOTAL) * 100}%`;
  $('progressBarWrap').setAttribute('aria-valuenow', onSummary ? TOTAL : i + 1);
  const answeredQs = state.submitted.reduce((a, s, mi) => a + (s ? MODULES[mi].quiz.length : 0), 0);
  $('scoreLabel').textContent = `Puntaje acumulado: ${totalScore()} / ${maxScore()}` + (answeredQs < maxScore() ? ` · ${answeredQs} respondidas` : '');

  // Indicadores de módulos
  let dots = MODULES.map((m, mi) => {
    const unlocked = isUnlocked(mi);
    const active = mi === i;
    const done = state.submitted[mi];
    const cls = active ? 'bg-white text-navy-900 ring-2 ring-white'
      : done ? 'bg-emerald-500 text-white hover:bg-emerald-400'
      : unlocked ? 'bg-navy-600 text-white hover:bg-navy-500' : 'bg-navy-800 text-navy-400 cursor-not-allowed';
    return `<button data-goto="${mi}" ${unlocked ? '' : 'disabled'} title="Módulo ${mi + 1}: ${m.title}${unlocked ? '' : ' (bloqueado)'}"
      class="w-8 h-8 rounded-lg text-xs font-bold transition ${cls}">${done && !active ? '✓' : mi + 1}</button>`;
  }).join('');
  const sumUnlocked = allSubmitted();
  dots += `<button data-goto="${SUMMARY}" ${sumUnlocked ? '' : 'disabled'} title="Resumen final${sumUnlocked ? '' : ' (bloqueado)'}"
    class="h-8 px-2 rounded-lg text-xs font-bold transition ${onSummary ? 'bg-white text-navy-900' : sumUnlocked ? 'bg-amber-400 text-navy-900 hover:bg-amber-300' : 'bg-navy-800 text-navy-400 cursor-not-allowed'}">🎓</button>`;
  $('moduleDots').innerHTML = dots;

  // Botones inferiores
  const prev = $('prevBtn'), next = $('nextBtn');
  prev.disabled = i === 0;
  let hint = '';
  if (onSummary) {
    next.classList.add('invisible');
  } else {
    next.classList.remove('invisible');
    next.disabled = !state.submitted[i];
    next.textContent = i === TOTAL - 1 ? 'Ver resumen final 🎓' : 'Siguiente módulo →';
    if (!state.submitted[i]) hint = '🔒 Completá el quiz para avanzar';
  }
  $('navHint').textContent = hint;
  $('navHintMobile').textContent = hint;
}

function goTo(i) {
  if (i < 0 || i > SUMMARY || !isUnlocked(i)) return;
  if (kpiChart) { kpiChart.destroy(); kpiChart = null; }
  state.current = i;
  if (i === SUMMARY) renderSummary(); else renderModule(i);
  renderChrome();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* =========================================================
   Eventos
   ========================================================= */
$('moduleContainer').addEventListener('change', e => {
  const t = e.target;
  if (t.type !== 'radio' || state.current === SUMMARY) return;
  const mi = state.current;
  if (state.submitted[mi]) return;
  state.answers[mi][Number(t.dataset.q)] = Number(t.value);
  renderQuiz(mi, t.name);
});

$('moduleContainer').addEventListener('click', e => {
  if (e.target.closest('#submitQuiz')) {
    const mi = state.current;
    if (state.answers[mi].some(a => a === null)) return;
    state.submitted[mi] = true;
    renderQuiz(mi);
    renderChrome();
    const res = $('quizResult');
    if (res) res.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  if (e.target.closest('#restartBtn')) {
    state.answers = MODULES.map(m => m.quiz.map(() => null));
    state.submitted = MODULES.map(() => false);
    goTo(0);
    return;
  }
  const g = e.target.closest('[data-goto]');
  if (g) goTo(Number(g.dataset.goto));
});

$('moduleDots').addEventListener('click', e => {
  const g = e.target.closest('[data-goto]');
  if (g && !g.disabled) goTo(Number(g.dataset.goto));
});

$('prevBtn').addEventListener('click', () => goTo(state.current - 1));
$('nextBtn').addEventListener('click', () => {
  if (state.current < SUMMARY && state.submitted[state.current]) goTo(state.current + 1);
});

goTo(0);
</script>
</body>
</html>
